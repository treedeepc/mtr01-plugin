[workspace]
members = [
    "plugin",
    "protocol",
    "sdk/leeway-plugin-abi",
    "sdk/leeway-plugin-contracts",
    "sdk/leeway-protocol-contracts",
    "sdk/leeway-protocol-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.dependencies]
aes = "0.9.4"
base64 = "0.22"
cmac = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
